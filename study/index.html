<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ARTIFACT:BEGIN -->
<title>밤톨이 학습 계획표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=IBM+Plex+Sans+KR:wght@200;300;400;500;600&display=swap">
<style>
/* ────────────────────────────────────────────────────────────
   팔레트는 밤톨이 털색에서 가져왔습니다.
   금빛 태비 → 공무원 카운트다운, 회색 태비 → 산안산기 카운트다운,
   모래빛 → 날짜 띠.
   종이 위 색은 인쇄물이라 한 벌만 씁니다. 화면 바깥(조작줄·바탕)만
   라이트/다크를 따라가고, 모든 색은 :root 에서 한 번씩 정의합니다.
   ──────────────────────────────────────────────────────────── */
:root{
  --paper:#fffdf9;
  --ink:#2b2621;
  --ink-soft:#7b7266;
  --ink-faint:#b3aa9c;
  --rule:#e2dacb;
  --rule-mid:#c6bca7;
  --rule-strong:#8d8371;
  --band:#f4ecda;
  --band-dim:#f0e9db;
  --gold:#a3762f;
  --gold-tint:#f8f1e2;
  --slate:#586870;
  --slate-tint:#eaf0f2;
  --rest:#faf8f2;
  --sun:#a8474c;
  --sat:#3f6a9e;

  --stage:#e9e4da;
  --panel:#fdfcf9;
  --panel-line:#ddd5c7;
  --panel-ink:#2b2621;
  --panel-soft:#7b7266;
  --panel-accent:#8d6224;
  --panel-field:#ffffff;
  --shadow:rgba(74,62,44,.20);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --stage:#161512; --panel:#21201c; --panel-line:#3b3833;
    --panel-ink:#ece6dc; --panel-soft:#a49b8c; --panel-accent:#d9ac63;
    --panel-field:#2b2925; --shadow:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --stage:#161512; --panel:#21201c; --panel-line:#3b3833;
  --panel-ink:#ece6dc; --panel-soft:#a49b8c; --panel-accent:#d9ac63;
  --panel-field:#2b2925; --shadow:rgba(0,0,0,.6);
}

*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--stage); color:var(--panel-ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:14px;
  -webkit-print-color-adjust:exact; print-color-adjust:exact;
}
.serif{font-family:"Nanum Myeongjo","Apple SD Gothic Neo","Malgun Gothic",serif}

/* ── 조작줄 (화면 전용) ───────────────────────────────── */
.bar{
  position:sticky; top:0; z-index:10;
  background:var(--panel); border-bottom:1px solid var(--panel-line);
  padding:11px 16px 12px;
}
.bar-in{max-width:1220px; margin:0 auto; display:flex; flex-wrap:wrap; align-items:flex-end; gap:12px 18px}
.field{display:flex; flex-direction:column; gap:5px; min-width:0}
.field > span{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--panel-soft); font-weight:500}
.field input,.field select{
  font:inherit; font-size:13px; color:var(--panel-ink); background:var(--panel-field);
  border:1px solid var(--panel-line); border-radius:4px; padding:6px 8px; min-width:0;
}
.field input[type="text"]{width:8.5ch}
.field input[type="date"]{width:15ch}
.field select{width:8.5ch}
.pair{display:flex; gap:6px; align-items:flex-end}
.spacer{flex:1 1 30px}
.btns{display:flex; gap:8px; align-items:center}
button{
  font:inherit; font-size:13px; cursor:pointer; color:var(--panel-ink);
  background:var(--panel-field); border:1px solid var(--panel-line);
  border-radius:4px; padding:7px 12px;
}
button:hover{border-color:var(--panel-accent); color:var(--panel-accent)}
button.step{padding:7px 10px; line-height:1}
button.go{background:var(--panel-accent); border-color:var(--panel-accent); color:var(--panel); font-weight:500}
button.go:hover{filter:brightness(1.1); color:var(--panel)}
:where(input,select,button):focus-visible{outline:2px solid var(--panel-accent); outline-offset:2px}
.hint{max-width:1220px; margin:0 auto; padding:9px 16px 0; font-size:11.5px; line-height:1.5; color:var(--panel-soft)}
.hint b{color:var(--panel-accent); font-weight:500}

/* ── 종이 ─────────────────────────────────────────────── */
.stage{padding:22px 16px 44px; overflow-x:auto}
.fit{margin:0 auto; width:max-content; display:flex; flex-direction:column; gap:22px}
.sheet{
  width:297mm; height:210mm; padding:10mm 9mm;
  background:var(--paper); color:var(--ink);
  box-shadow:0 1px 3px var(--shadow), 0 14px 34px var(--shadow);
  transform-origin:top left;
  display:flex; flex-direction:column;
  font-size:3.1mm; line-height:1.35;
}

/* 제호 — 두 장 모두 같은 머리를 씁니다 */
.mast{position:relative; display:flex; align-items:flex-end; justify-content:space-between; gap:8mm; padding-bottom:2.4mm; border-bottom:.5mm solid var(--ink)}
.mast h1{margin:0; font-weight:800; font-size:7.8mm; line-height:1; letter-spacing:-.01em; text-wrap:balance}
.mast .sub{margin-top:1.6mm; font-size:2.9mm; letter-spacing:.03em; color:var(--ink-soft); font-weight:300}
.mast .of{font-size:2.5mm; letter-spacing:.22em; color:var(--ink-faint); font-weight:400; margin-bottom:1mm}
.counts{display:flex; align-items:flex-end; gap:6mm; flex:0 0 auto}
.count{min-width:26mm; text-align:right; padding-left:6mm; border-left:.25mm solid var(--rule-mid);
  display:flex; flex-direction:column; align-items:flex-end; justify-content:flex-end}
.count:first-child{border-left:none; padding-left:0}
.count .who{font-size:2.6mm; font-weight:600; letter-spacing:.12em; color:var(--gold)}
.count.b .who{color:var(--slate)}
.count .num{height:8.6mm; display:flex; align-items:flex-end; font-size:8.2mm; font-weight:200;
  line-height:.92; letter-spacing:-.02em; font-variant-numeric:tabular-nums; margin-top:.6mm}
.count .num em{font-style:normal; font-weight:400; font-size:4.4mm; letter-spacing:0}
.count .when{font-size:2.5mm; font-weight:300; color:var(--ink-faint); margin-top:.8mm; min-height:3.4mm}
.count .num.none{font-size:2.9mm; font-weight:300; color:var(--ink-faint); line-height:1.3; padding-bottom:.6mm}

/* ── 1장: 계획표 ──────────────────────────────────────── */
table{width:100%; border-collapse:collapse; table-layout:fixed; font-variant-numeric:tabular-nums}
.grid{margin-top:3.2mm}
.grid th,.grid td{border-left:.2mm solid var(--rule); border-bottom:.2mm solid var(--rule); padding:0 .8mm; text-align:center; overflow:hidden}
.grid th:first-child,.grid td:first-child{border-left:none}
.grid tr.hrow th,.grid tr.hrow td{height:6mm}
.grid tr.srow td,.grid tr.srow th{height:7.9mm}
.grid tr.rule td,.grid tr.rule th{border-bottom-color:var(--rule-mid)}
.grid tr.top td,.grid tr.top th{border-top:.45mm solid var(--rule-strong)}
.grid tr:last-child td,.grid tr:last-child th{border-bottom:.45mm solid var(--rule-strong)}
.lab{font-weight:400; font-size:2.9mm; letter-spacing:.02em; white-space:nowrap; text-align:right; padding-right:2.4mm; color:var(--ink-soft)}
.lab b{font-weight:600; color:var(--ink)}
.lab.gong{background:var(--gold-tint)} .lab.gong b{color:var(--gold)}
.lab.san{background:var(--slate-tint)} .lab.san b{color:var(--slate)}
.lab.plain{background:var(--rest)}
.subj{font-weight:700; font-size:3.7mm; background:var(--rest); color:var(--ink); white-space:nowrap}
.src{text-align:left; padding-left:1.8mm; font-size:2.9mm; font-weight:300; background:var(--paper)}
td.gcell{background:var(--gold-tint)} td.scell{background:var(--slate-tint)}
.dnum{font-size:3.1mm; font-weight:400; color:var(--gold)}
.dnum.b{color:var(--slate)}
.dnum.zero{font-weight:700; font-size:2.8mm}
.dnum.past{color:var(--ink-faint); font-weight:200}
.blank{display:block; height:.2mm; margin:0 auto; width:5mm; background:var(--rule-mid)}
td.date{background:var(--band); font-weight:500; font-size:3mm}
td.date.wk{background:var(--band-dim)}
td.dow{font-size:2.9mm; font-weight:500}
td.dow.s0{color:var(--sun)} td.dow.s6{color:var(--sat)}
td.wk{background:var(--rest)}
td.mark{box-shadow:inset 0 0 0 .45mm var(--gold)}
td.mark.b{box-shadow:inset 0 0 0 .45mm var(--slate)}

.cap{font-weight:700; font-size:2.7mm; letter-spacing:.22em; color:var(--ink-soft); padding-bottom:1.4mm; margin-bottom:2.4mm; border-bottom:.2mm solid var(--rule-mid)}
.foot{
  flex:1; min-height:0; margin-top:4mm;
  display:grid; grid-template-columns:minmax(0,1fr) 52mm; gap:0 8mm;
  border-bottom:.3mm solid var(--rule-mid);   /* 밤톨이가 앉을 선 */
}
.memos{display:flex; flex-direction:column; gap:2mm}
.memo{display:grid; grid-template-columns:23mm minmax(0,1fr); gap:2.4mm}
.memo .who{font-weight:700; font-size:3mm; text-align:right; padding-right:2.4mm; padding-top:.6mm; border-right:.2mm solid var(--rule-mid); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.memo .who.etc{font-family:"IBM Plex Sans KR",sans-serif; font-weight:400; font-size:2.6mm; color:var(--ink-soft)}
.lines{position:relative; height:11.6mm}
.lines .rules{position:absolute; inset:0; display:flex; flex-direction:column}
.lines .rules i{flex:1 1 0; border-bottom:.2mm solid var(--rule)}
.lines .ink{position:relative; font-size:2.9mm; font-weight:300; line-height:5.8mm; min-height:11.6mm}

/* 밤톨이 */
.bam{display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:1.4mm}
.bam img{width:100%; height:auto; display:block}
.bam .tag{font-size:2.4mm; letter-spacing:.2em; color:var(--ink-faint)}
/* 밤톨이 스티커 — 쓰는 칸을 피해 빈 자리에만 앉힙니다 */
.st{position:absolute; display:block; z-index:1}
.mast .st.loaf{left:40%; bottom:-2.4mm; width:26mm}
.mast .st.face{left:63%; bottom:3.4mm; width:13mm; transform:rotate(-7deg)}
.mast.cal .st.face{left:52%; bottom:-1mm; width:15mm; transform:rotate(6deg)}
.cg td.nest{position:relative; overflow:visible}
.cg td.nest .st.loaf{right:1mm; bottom:-1.4mm; width:28mm}

/* 2장 달력: 남는 끝칸 위로 작게 한 마리 더 */
.cgwrap{position:relative; flex:1; display:flex; min-height:0}
.cgwrap table{flex:1}
.cgwrap .st.peek{right:1.5mm; bottom:0; width:36mm; height:auto}

/* ── 2장: 달력 ────────────────────────────────────────── */
.cg{margin-top:4mm; flex:1; display:flex; flex-direction:column}
.cg table{flex:1; height:100%}
.cg th{
  height:6.6mm; font-size:2.8mm; font-weight:600; letter-spacing:.16em;
  color:var(--ink-soft); border-bottom:.45mm solid var(--rule-strong);
  padding-bottom:1mm;
}
.cg th.s0{color:var(--sun)} .cg th.s6{color:var(--sat)}
.cg td{
  border-left:.2mm solid var(--rule); border-bottom:.2mm solid var(--rule);
  vertical-align:top; padding:1.4mm 1.6mm; text-align:left; overflow:hidden;
}
.cg td:first-child{border-left:none}
.cg tbody tr:last-child td{border-bottom:.45mm solid var(--rule-strong)}
.cg .day{display:flex; align-items:baseline; justify-content:space-between; gap:1.6mm}
.cg .n{font-size:3.6mm; font-weight:500; line-height:1}
.cg td.s0 .n{color:var(--sun)} .cg td.s6 .n{color:var(--sat)}
.cg td.out .n{color:var(--ink-faint); font-weight:200}
.cg .dd{display:flex; gap:1.8mm; font-size:2.4mm; font-weight:400; font-variant-numeric:tabular-nums}
.cg .dd .g{color:var(--gold)} .cg .dd .s{color:var(--slate)}
.cg td.on{background:var(--band)}
.cg td.x{box-shadow:inset 0 0 0 .5mm var(--gold)}
.cg td.x.b{box-shadow:inset 0 0 0 .5mm var(--slate)}
.cg .flag{
  margin-top:1.4mm; display:inline-block; padding:.5mm 1.4mm;
  font-size:2.4mm; font-weight:600; letter-spacing:.04em;
  color:var(--paper); background:var(--gold);
}
.cg .flag.b{background:var(--slate)}
.legend{display:flex; flex-wrap:wrap; gap:1mm 4mm; margin-top:2.6mm; font-size:2.5mm; color:var(--ink-soft)}
.legend i{font-style:normal; display:inline-flex; align-items:center; gap:1.4mm}
.legend i::before{content:""; width:2.8mm; height:2.8mm; background:var(--gold); flex:0 0 auto}
.legend i.b::before{background:var(--slate)}
.legend i.r::before{background:var(--band)}

/* 손으로 채우는 칸 */
[contenteditable]{outline:none; cursor:text}
[contenteditable]:empty::before{content:attr(data-ph); color:var(--ink-faint); font-weight:200}
@media screen{
  [contenteditable]:hover{background:var(--gold-tint)}
  [contenteditable]:focus{background:var(--gold-tint); box-shadow:inset 0 0 0 .25mm var(--gold)}
}

@media print{
  @page{size:A4 landscape; margin:9mm}
  html,body{background:var(--paper)}
  .bar,.hint{display:none !important}
  .stage{padding:0; overflow:visible}
  .fit{width:auto; gap:0; display:block}
  .sheet{
    width:279mm; height:190mm; padding:0; overflow:hidden;
    box-shadow:none; transform:none !important;
    break-inside:avoid; page-break-inside:avoid;
    break-after:page; page-break-after:always;
  }
  .sheet:last-child{break-after:auto; page-break-after:auto}
  [contenteditable]:empty::before{content:""}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important}}
</style>
</head>
<body>

<div class="bar">
  <div class="bar-in">
    <label class="field">
      <span>기간 시작</span>
      <span class="pair">
        <button class="step" id="prev" type="button" aria-label="앞 기간으로">&#8592;</button>
        <input type="date" id="start">
        <button class="step" id="next" type="button" aria-label="다음 기간으로">&#8594;</button>
      </span>
    </label>
    <label class="field">
      <span>일수</span>
      <select id="days">
        <option value="7">7일</option><option value="10">10일</option>
        <option value="12">12일</option><option value="14">14일</option>
      </select>
    </label>
    <label class="field">
      <span>시험 1</span>
      <span class="pair"><input type="text" id="e0n" maxlength="8"><input type="date" id="e0d"></span>
    </label>
    <label class="field">
      <span>시험 2</span>
      <span class="pair"><input type="text" id="e1n" maxlength="8"><input type="date" id="e1d"></span>
    </label>
    <label class="field">
      <span>과목</span>
      <span class="pair">
        <input type="text" id="s0" maxlength="8"><input type="text" id="s1" maxlength="8"><input type="text" id="s2" maxlength="8">
      </span>
    </label>
    <span class="spacer"></span>
    <span class="btns">
      <button type="button" id="reset">처음값으로</button>
      <button type="button" class="go" id="print">인쇄 / PDF 저장</button>
    </span>
  </div>
  <p class="hint" id="hint"></p>
</div>

<div class="stage" id="stage">
  <div class="fit" id="fit">

    <!-- 1장 · 학습 계획표 -->
    <div class="sheet" id="sheet-plan">
      <header class="mast">
        <div>
          <div class="of">첫째 장 · 학습 계획표</div>
          <h1 class="serif"><span contenteditable="plaintext-only" data-k="title" data-ph="학습 계획">학습 계획</span></h1>
          <div class="sub" id="range"></div>
        </div>
        <div class="counts" data-counts></div>
      </header>

      <table class="grid" id="grid"></table>

      <div class="foot">
        <section>
          <div class="cap serif">과목별 메모</div>
          <div class="memos" id="memos"></div>
        </section>
        <section class="bam">
          <div class="tag">밤톨이 감독관</div>
          <img id="bam-peek" alt="밤톨이" draggable="false">
        </section>
      </div>
    </div>

    <!-- 2장부터 · 달력 (기간이 걸친 달마다 한 장) -->
    <div id="calpages"></div>

  </div>
</div>

<script>
(function(){
  "use strict";

  var KEY  = "bamtolPlanner.v2";
  var DOW  = ["일","월","화","수","목","금","토"];

  function sticker(kind, cls){
    var im = document.createElement("img");
    im.src = ART[kind]; im.alt = "밤톨이"; im.draggable = false;
    im.className = "st " + kind + (cls ? " " + cls : "");

  var ROWS = 3;   // 과목마다 적는 칸 3개
  var MEMO = 4;   // 과목 3 + 그 외 1

  function pad(n){ return (n < 10 ? "0" : "") + n; }
  function iso(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function parse(s){
    if(!s) return null;
    var p = String(s).split("-");
    if(p.length !== 3) return null;
    var d = new Date(+p[0], +p[1]-1, +p[2]);
    return isNaN(d.getTime()) ? null : d;
  }
  function addDays(d, n){ var x = new Date(d); x.setDate(x.getDate()+n); return x; }
  function serial(d){ return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())/864e5); }
  function gap(a, b){ return serial(a) - serial(b); }
  function isWeekend(d){ var g = d.getDay(); return g === 0 || g === 6; }

  function defaults(){
    var t = new Date(); t.setHours(0,0,0,0);
    return {
      start: iso(addDays(t, -((t.getDay()+6)%7))),   // 이번 주 월요일
      days: 14,
      exams: [
        { name:"공무원",   date:"2027-06-19" },
        { name:"산안산기", date:"" }
      ],
      subjects: ["국어","기계","산안산기"],
      cells: {}
    };
  }

  var S, D = defaults();
  try{ S = JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ S = {}; }
  if(!parse(S.start)) S.start = D.start;
  if([7,10,12,14].indexOf(+S.days) < 0) S.days = D.days;
  if(!Array.isArray(S.exams) || S.exams.length !== 2) S.exams = D.exams;
  if(!Array.isArray(S.subjects) || S.subjects.length !== 3) S.subjects = D.subjects;
  if(!S.cells || typeof S.cells !== "object") S.cells = {};
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

  function el(tag, cls, txt){
    var n = document.createElement(tag);
    if(cls) n.className = cls;
    if(txt != null) n.textContent = txt;
    return n;
  }
  function editable(node, key, ph){
    node.setAttribute("contenteditable", "plaintext-only");
    node.setAttribute("data-k", key);
    if(ph) node.setAttribute("data-ph", ph);
    node.textContent = S.cells[key] || "";
    return node;
  }
  function examName(i){ return S.exams[i].name || ("시험 " + (i+1)); }
  function subjName(i){ return S.subjects[i] || ("과목 " + (i+1)); }
  function examDates(){ return [parse(S.exams[0].date), parse(S.exams[1].date)]; }

  function dayList(){
    var s = parse(S.start) || parse(D.start), out = [];
    for(var i = 0; i < S.days; i++) out.push(addDays(s, i));
    return out;
  }

  /* 제호의 카운트다운 — 모든 장에 같은 것을 답니다 */
  function fillCounts(box){
    box.textContent = "";
    var today = new Date(); today.setHours(0,0,0,0);
    S.exams.forEach(function(ex, i){
      var c = el("div", "count" + (i ? " b" : ""));
      c.appendChild(el("div", "who", examName(i)));
      var d = parse(ex.date);
      if(!d){
        c.appendChild(el("div", "num none", "시험일 미정"));
        c.appendChild(el("div", "when", ""));
      }else{
        var n = gap(d, today), num = el("div", "num");
        if(n > 0){ num.appendChild(el("em", null, "D-")); num.appendChild(document.createTextNode(String(n))); }
        else if(n === 0){ num.appendChild(el("em", null, "D-DAY")); }
        else { num.appendChild(el("em", null, "D+")); num.appendChild(document.createTextNode(String(-n))); }
        c.appendChild(num);
        c.appendChild(el("div", "when", d.getFullYear() + ". " + (d.getMonth()+1) + ". " + d.getDate() + "."));
      }
      box.appendChild(c);
    });
  }
  function renderCounts(){
    Array.prototype.forEach.call(document.querySelectorAll("[data-counts]"), fillCounts);
  }

  /* 1장 · 계획표 */
  function renderGrid(days){
    var t = document.getElementById("grid");
    t.textContent = "";
    var n = days.length, ed = examDates();

    var cg = document.createElement("colgroup");
    ["17mm","38mm"].forEach(function(w){
      var c = document.createElement("col"); c.style.width = w; cg.appendChild(c);
    });
    // 날짜 열은 폭을 지정하지 않습니다. table-layout:fixed 가 남은 폭을
    // 균등하게 나눠 줍니다 (col 에서 calc(%+mm) 은 0 으로 깨집니다).
    for(var i = 0; i < n; i++) cg.appendChild(document.createElement("col"));
    t.appendChild(cg);

    var body = document.createElement("tbody");

    S.exams.forEach(function(ex, ei){
      var tr = el("tr", "hrow" + (ei === 0 ? " top" : " rule"));
      var th = el("th", "lab " + (ei ? "san" : "gong"));
      th.colSpan = 2;
      th.appendChild(el("b", null, examName(ei)));
      th.appendChild(document.createTextNode(" D-day"));
      tr.appendChild(th);
      days.forEach(function(d){
        var td = el("td", ei ? "scell" : "gcell");
        if(!ed[ei]){
          td.appendChild(el("span", "blank"));
        }else{
          var k = gap(ed[ei], d), cls = "dnum" + (ei ? " b" : "");
          if(k === 0){ cls += " zero"; td.className += " mark" + (ei ? " b" : ""); }
          else if(k < 0){ cls += " past"; }
          td.appendChild(el("span", cls, k > 0 ? String(k) : (k === 0 ? "D-DAY" : "—")));
        }
        tr.appendChild(td);
      });
      body.appendChild(tr);
    });

    var trD = el("tr", "hrow");
    var thD = el("th", "lab plain"); thD.colSpan = 2;
    thD.appendChild(el("b", null, "날짜")); trD.appendChild(thD);
    days.forEach(function(d){
      trD.appendChild(el("td", "date" + (isWeekend(d) ? " wk" : ""), (d.getMonth()+1) + "/" + d.getDate()));
    });
    body.appendChild(trD);

    var trW = el("tr", "hrow rule");
    var thW = el("th", "lab plain"); thW.colSpan = 2;
    thW.appendChild(el("b", null, "요일")); trW.appendChild(thW);
    days.forEach(function(d){
      trW.appendChild(el("td", "dow s" + d.getDay() + (isWeekend(d) ? " wk" : ""), DOW[d.getDay()]));
    });
    body.appendChild(trW);

    var trR = el("tr", "hrow rule");
    var thR = el("th", "lab plain"); thR.colSpan = 2;
    thR.appendChild(el("b", null, "휴식 / 메모")); trR.appendChild(thR);
    days.forEach(function(d){ trR.appendChild(el("td", isWeekend(d) ? "wk" : null)); });
    body.appendChild(trR);

    S.subjects.forEach(function(name, si){
      for(var r = 0; r < ROWS; r++){
        var tr = el("tr", "srow" + (r === ROWS-1 ? " rule" : ""));
        if(r === 0){
          var th = el("th", "subj serif", subjName(si));
          th.rowSpan = ROWS;
          tr.appendChild(th);
        }
        tr.appendChild(editable(el("td", "src"), "s" + si + "r" + r, r === 0 ? "교재 / 범위" : ""));
        days.forEach(function(d){ tr.appendChild(el("td", isWeekend(d) ? "wk" : null)); });
        body.appendChild(tr);
      }
    });
    t.appendChild(body);
  }

  function renderMemos(){
    var box = document.getElementById("memos");
    box.textContent = "";
    for(var i = 0; i < MEMO; i++){
      var etc = (i === MEMO - 1);
      var row = el("div", "memo");
      row.appendChild(el("div", "who" + (etc ? " etc" : " serif"), etc ? "그 외 · 알아보기" : subjName(i)));
      var lines = el("div", "lines");
      var rules = el("div", "rules");
      rules.appendChild(el("i")); rules.appendChild(el("i"));
      lines.appendChild(rules);
      lines.appendChild(editable(el("div", "ink"), "m" + i, ""));
      row.appendChild(lines);
      box.appendChild(row);
    }
  }

  /* 2장부터 · 달력. 기간이 걸친 달마다 한 장씩 */
  function renderCalPages(days){
    var host = document.getElementById("calpages");
    host.textContent = "";

    // 기간이 걸친 달마다 한 장. 다만 걸친 날이 사흘도 안 되는 달은
    // 거의 빈 장이 나오므로 뺍니다 (그 며칠은 계획표에 이미 있습니다).
    var count = {};
    days.forEach(function(d){
      var k = d.getFullYear() + "-" + d.getMonth();
      count[k] = (count[k] || 0) + 1;
    });
    var first = days[0], last = days[days.length-1];
    var cur = new Date(first.getFullYear(), first.getMonth(), 1);
    var end = new Date(last.getFullYear(), last.getMonth(), 1);
    var all = [];
    while(cur <= end){ all.push(new Date(cur)); cur.setMonth(cur.getMonth()+1); }
    var months = all.filter(function(m){ return count[m.getFullYear() + "-" + m.getMonth()] >= 3; });
    if(!months.length) months = [all[0]];

    var inRange = {}, examAt = {};
    days.forEach(function(d){ inRange[serial(d)] = true; });
    S.exams.forEach(function(ex, i){
      var d = parse(ex.date);
      if(d) examAt[serial(d)] = i;
    });
    var ed = examDates();

    months.forEach(function(m, mi){
      var sheet = el("div", "sheet");

      var mast = el("header", "mast cal");
      var left = el("div");
      left.appendChild(el("div", "of", (ORD[mi+1] || (mi+2) + "번째") + " 장 · 달력"));
      var h = el("h1", "serif", m.getMonth()+1 + "월");
      var yr = el("span", null, " " + m.getFullYear());
      yr.style.fontSize = "4.4mm"; yr.style.fontWeight = "400"; yr.style.color = "var(--ink-faint)";
      h.appendChild(yr);
      left.appendChild(h);
      left.appendChild(el("div", "sub", "칸마다 그날 할 일을 적습니다."));
      mast.appendChild(left);
      var cbox = el("div", "counts"); cbox.setAttribute("data-counts", ""); mast.appendChild(cbox);
      mast.appendChild(sticker("face"));
      sheet.appendChild(mast);

      var wrap = el("div", "cg");
      var tw = el("div", "cgwrap");
      var t = document.createElement("table");
      var thead = document.createElement("thead"), hr = document.createElement("tr");
      DOW.forEach(function(w, i){ hr.appendChild(el("th", "s" + i, w)); });
      thead.appendChild(hr); t.appendChild(thead);

      var tb = document.createElement("tbody");
      var lead  = new Date(m.getFullYear(), m.getMonth(), 1).getDay();
      var total = new Date(m.getFullYear(), m.getMonth()+1, 0).getDate();
      var weeks = Math.ceil((lead + total) / 7);
      var idx = 0, leadCells = [];

      for(var w = 0; w < weeks; w++){
        var tr = document.createElement("tr");
        for(var c = 0; c < 7; c++, idx++){
          var day = idx - lead + 1;
          if(day < 1 || day > total){
            var blank = el("td", "out");
            if(day < 1) leadCells.push(blank);
            tr.appendChild(blank); continue;
          }

          var d = new Date(m.getFullYear(), m.getMonth(), day), k = serial(d);
          var cls = "s" + c;
          if(inRange[k]) cls += " on";
          if(examAt[k] !== undefined) cls += " x" + (examAt[k] ? " b" : "");
          var td = el("td", cls);

          var head = el("div", "day");
          head.appendChild(el("span", "n", String(day)));
          var dd = el("div", "dd");
          [0,1].forEach(function(ei){
            if(!ed[ei]) return;
            var v = gap(ed[ei], d);
            if(v < 0) return;
            dd.appendChild(el("span", ei ? "s" : "g", v === 0 ? "D-DAY" : String(v)));
          });
          head.appendChild(dd);
          td.appendChild(head);

          if(examAt[k] !== undefined){
            td.appendChild(el("span", "flag" + (examAt[k] ? " b" : ""), examName(examAt[k]) + " 시험"));
          }
          tr.appendChild(td);
        }
        tb.appendChild(tr);
      }
      // 1일 앞에 빈 칸이 두 개 이상이면 그 자리에 식빵 자세로 한 마리.
      if(leadCells.length >= 2){
        var nest = leadCells[leadCells.length - 1];
        nest.className = "out nest";
        nest.appendChild(sticker("loaf"));
      }
      t.appendChild(tb);
      tw.appendChild(t);

      // 마지막 주에 남는 빈 칸이 두 칸 이상이면 그 자리에 스티커를 앉힙니다.
      var trail = (7 - ((lead + total) % 7)) % 7;
      if(trail >= 2){
        var peek = sticker("peek", "peek");
        peek.style.width = Math.min(trail * 36, 44) + "mm";
        tw.appendChild(peek);
      }
      wrap.appendChild(tw);

      var lg = el("div", "legend");
      lg.appendChild(el("i", "r", "이번 계획 기간"));
      S.exams.forEach(function(ex, i){
        if(ed[i]) lg.appendChild(el("i", i ? "b" : "", examName(i) + " D-day · 시험일"));
      });
      wrap.appendChild(lg);
      sheet.appendChild(wrap);
      host.appendChild(sheet);
    });
  }

  function renderHint(){
    var missing = S.exams.filter(function(e){ return !parse(e.date); }).map(function(e){ return e.name || "시험"; });
    var h = document.getElementById("hint");
    h.textContent = "";
    if(missing.length){
      h.appendChild(document.createTextNode("위에 "));
      h.appendChild(el("b", null, missing.join(" · ") + " 시험일"));
      h.appendChild(document.createTextNode("을 넣으면 D-day가 계획표와 달력에 자동으로 채워집니다. "));
    }
    h.appendChild(document.createTextNode("교재 칸과 메모줄은 눌러서 바로 쓸 수 있고, 쓴 내용은 이 브라우저에 저장됩니다. 인쇄하면 계획표와 달력이 따로 한 장씩 나옵니다."));
  }

  function render(){
    var days = dayList(), a = days[0], b = days[days.length-1];
    document.getElementById("range").textContent =
      a.getFullYear() + "년 " + (a.getMonth()+1) + "월 " + a.getDate() + "일 – " +
      (b.getMonth()+1) + "월 " + b.getDate() + "일 · " + days.length + "일";

    var title = document.querySelector('[data-k="title"]');
    if(document.activeElement !== title) title.textContent = S.cells.title || "학습 계획";

    renderGrid(days);
    renderMemos();
    renderCalPages(days);
    renderCounts();          // 달력 장을 만든 뒤라야 그 장에도 붙습니다
    renderHint();
    fit();
  }

  /* 화면 폭에 맞춰 축소 */
  function fit(){
    var stage = document.getElementById("stage");
    var box   = document.getElementById("fit");
    var sheets = document.querySelectorAll(".sheet");
    if(!sheets.length) return;
    var w = sheets[0].offsetWidth;
    var k = Math.min(1, (stage.clientWidth - 32) / w);
    box.style.width = k < 1 ? (w * k) + "px" : "max-content";
    Array.prototype.forEach.call(sheets, function(s){
      s.style.transform = k < 1 ? "scale(" + k + ")" : "none";
      s.style.height = "210mm";
      s.style.marginBottom = k < 1 ? (s.offsetHeight * (k - 1)) + "px" : "";
    });
  }

  function bind(id, get, set){
    var n = document.getElementById(id);
    n.value = get();
    n.addEventListener("change", function(){ set(n.value); save(); render(); });
  }
  bind("start", function(){ return S.start; }, function(v){ if(parse(v)) S.start = v; });
  bind("days",  function(){ return String(S.days); }, function(v){ S.days = +v; });
  bind("e0n",   function(){ return S.exams[0].name; }, function(v){ S.exams[0].name = v; });
  bind("e0d",   function(){ return S.exams[0].date; }, function(v){ S.exams[0].date = v; });
  bind("e1n",   function(){ return S.exams[1].name; }, function(v){ S.exams[1].name = v; });
  bind("e1d",   function(){ return S.exams[1].date; }, function(v){ S.exams[1].date = v; });
  [0,1,2].forEach(function(i){
    bind("s" + i, function(){ return S.subjects[i]; }, function(v){ S.subjects[i] = v; });
  });

  function shift(sign){
    var d = parse(S.start); if(!d) return;
    S.start = iso(addDays(d, sign * S.days));
    document.getElementById("start").value = S.start;
    save(); render();
  }
  document.getElementById("prev").addEventListener("click", function(){ shift(-1); });
  document.getElementById("next").addEventListener("click", function(){ shift(1); });
  document.getElementById("print").addEventListener("click", function(){ window.print(); });
  document.getElementById("reset").addEventListener("click", function(){
    if(!confirm("적어 둔 교재와 메모까지 모두 처음값으로 되돌립니다. 계속할까요?")) return;
    S = defaults(); save();
    var v = {
      start:S.start, days:String(S.days),
      e0n:S.exams[0].name, e0d:S.exams[0].date,
      e1n:S.exams[1].name, e1d:S.exams[1].date,
      s0:S.subjects[0], s1:S.subjects[1], s2:S.subjects[2]
    };
    Object.keys(v).forEach(function(id){ document.getElementById(id).value = v[id]; });
    render();
  });

  document.getElementById("stage").addEventListener("input", function(e){
    var k = e.target.getAttribute && e.target.getAttribute("data-k");
    if(!k) return;
    S.cells[k] = e.target.textContent;
    save();
  });

  document.getElementById("bam-peek").src = ART.peek;
  var planMast = document.querySelector("#sheet-plan .mast");
  planMast.appendChild(sticker("loaf"));
  planMast.appendChild(sticker("face"));

  window.addEventListener("resize", fit);
  window.addEventListener("beforeprint", function(){
    Array.prototype.forEach.call(document.querySelectorAll(".sheet"), function(s){
      s.style.transform = "none"; s.style.marginBottom = ""; s.style.height = "";
    });
  });
  window.addEventListener("afterprint", fit);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

  render();
})();
</script>
<!-- ARTIFACT:END -->
</body>
</html>
