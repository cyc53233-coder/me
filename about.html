<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d2a66">
<title>{site} — 채널 소개</title>
<meta name="description" content="채널 소개, 등급 안내, 수수료 고지.">
<!-- 소개 페이지도 카톡에 붙습니다 — 미리보기가 비면 아무도 안 누릅니다.
     주소와 사진은 app.js 가 data/site.js 를 보고 절대주소로 채웁니다. -->
<meta property="og:type" content="website">
<meta property="og:title" content="채널 소개 · 수수료 고지">
<meta property="og:description" content="평소보다 확실히 싼 것만 골라 올리는 핫딜 채널입니다. 등급 기준과 수수료 고지를 여기에 적어 둡니다.">
<meta property="og:url" content="">
<meta property="og:image" content="">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<div class="notice-bar"><div class="wrap" data-site-share-disclosure></div></div>

<header class="top">
  <div class="wrap top-inner">
    <a class="brand" href="./">
      <span class="logo" data-site-emoji>🔥</span>
      <span class="brand-text">
        <small>실시간 핫딜</small>
        <b>채널 소개</b>
      </span>
    </a>
    <button class="menu-btn" id="menu-btn" type="button" aria-label="메뉴" aria-expanded="false">☰</button>
    <nav class="menu" id="menu" hidden>
      <a href="./">핫딜 모아보기</a>
    </nav>
  </div>
</header>

<main>
  <section class="wrap prose">
    <div data-site-intro></div>

    <h2>실시간 알림방</h2>
    <p>새 딜은 카카오톡 오픈채팅방에 가장 먼저 올라갑니다. 이 사이트는 최근 딜을 모아 보는 곳입니다.</p>
    <div data-site-openchat></div>

    <h2 id="등급">등급 안내</h2>
    <ul class="grades" data-site-grades></ul>

    <h2>수수료 고지</h2>
    <p class="disclosure" data-site-disclosure></p>
    <p>링크를 눌러 구매하시면 판매 금액의 일부가 수수료로 지급됩니다. 구매자가 내는 가격은 링크를 거치지 않을 때와 같습니다.</p>
    <ul data-site-notes></ul>
  </section>
</main>

<footer>
  <div class="wrap"><p><a href="./">← 핫딜 모아보기</a></p></div>
</footer>

<script src="data/site.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
