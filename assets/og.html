<!doctype html>
<!-- 카톡·인스타 미리보기 사진(1200×630)의 원본입니다.
     고친 뒤 `cd site-test && npm run og` 로 assets/og.png 를 다시 만듭니다. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 88px;
    background: linear-gradient(135deg, #0d2a66 0%, #08183f 100%);
    color: #fff;
    font-family: Pretendard, -apple-system, sans-serif;
    letter-spacing: -0.04em;
  }
  .fire { font-size: 92px; line-height: 1; margin-bottom: 26px; }
  h1 { font-size: 108px; font-weight: 800; line-height: 1.05; }
  p { margin-top: 26px; font-size: 40px; font-weight: 600; color: #f7bd45; }
  .grades { margin-top: 44px; display: flex; gap: 14px; }
  .g {
    padding: 13px 26px; border-radius: 999px;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.2);
    font-size: 30px; font-weight: 700;
  }
</style>
</head>
<body>
  <div class="fire">🔥</div>
  <h1>핫딜 주워담기</h1>
  <p>평소보다 확실히 싼 것만 골라 올립니다</p>
  <div class="grades">
    <span class="g">무지성급 🔥🔥🔥</span>
    <span class="g">대박 🔥🔥</span>
    <span class="g">추천 🔥</span>
  </div>
</body>
</html>
