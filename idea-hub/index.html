<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{hub} — 공무원이 만든 AI 도구 모음</title>
<meta name="description" content="공무원이 직접 만든 프롬프트, 맞춤봇, 매크로, 스킬을 모아 누구나 가져다 쓰게 하는 공공 아이디어 허브.">
<meta property="og:type" content="website">
<meta property="og:title" content="공공 아이디어 허브">
<meta property="og:description" content="공무원이 직접 만든 AI 도구를 모아, 누구나 가져다 쓰게 합니다.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏛️</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="top">
  <div class="wrap top-inner">
    <a class="brand" href="./">
      <span class="brand-emoji" data-hub-emoji>🏛️</span>
      <span data-hub-name>아이디어 허브</span>
    </a>
    <nav class="top-nav">
      <a href="./" aria-current="page">도구</a>
      <a href="about.html">소개</a>
      <a href="submit.html" class="is-primary">도구 등록</a>
    </nav>
  </div>
</header>

<main>
  <section class="hero">
    <div class="wrap">
      <h1>공무원이 만든 AI 도구, 한곳에</h1>
      <p data-hub-tagline></p>
      <div class="hero-stats">
        <span><b id="stat-tools">0</b>개 도구</span>
        <span><b id="stat-areas">0</b>개 업무 분야</span>
        <span><b id="stat-people">0</b>곳에서 기여</span>
      </div>
      <div class="hero-cta">
        <a class="btn" href="submit.html">내 도구 등록하기</a>
        <a class="btn btn-ghost" href="about.html">어떻게 운영되나요?</a>
      </div>
      <p class="notice">
        <span>ℹ️</span>
        <span data-hub-notice></span>
      </p>
    </div>
  </section>

  <section class="wrap controls">
    <div class="search">
      <span>🔎</span>
      <label for="q" class="sr-only">도구 검색</label>
      <input id="q" type="search" placeholder="도구 이름, 업무, 태그로 찾기 (예: 민원, 보도자료, 엑셀)" autocomplete="off">
    </div>
    <div class="chips" id="chips-area" aria-label="업무 분야"></div>
    <div class="chips is-types" id="chips-type" aria-label="도구 유형"></div>
    <div class="row">
      <button class="linkish" id="sort" type="button">최신순</button>
      <span>·</span>
      <button class="linkish" id="retired" type="button" aria-pressed="false">내린 도구 포함</button>
      <span class="spacer"></span>
      <span><b id="stat-shown">0</b>개 표시</span>
    </div>
  </section>

  <section class="wrap">
    <div class="grid" id="grid"></div>
  </section>
</main>

<dialog class="detail" id="detail" aria-label="도구 상세"></dialog>

<footer>
  <div class="wrap">
    <p data-hub-notice></p>
    <p>© <span data-hub-name></span> · <a href="about.html">소개</a> · <a href="submit.html">도구 등록</a> · <a data-repo-link href="#" target="_blank" rel="noopener">GitHub</a></p>
  </div>
</footer>

<script src="data/site.js"></script>
<script src="data/tools.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
