name: 🏛️ 도구 등록 (공공 아이디어 허브)
description: 내가 만든 AI 도구를 허브에 올립니다. 운영자가 확인한 뒤 게시됩니다.
title: "도구: "
labels: ["hub"]
body:
  - type: markdown
    attributes:
      value: |
        실제 민원인·직원 이름, 연락처, 사건번호, 내부망 자료는 **예시로도 넣지 마세요.** 발견되면 게시하지 않습니다.
        사이트의 [도구 등록 페이지](https://cyc53233-coder.github.io/me/idea-hub/submit.html)에서 채우면 이 폼이 미리 채워진 채로 열립니다.
  - type: input
    id: name
    attributes:
      label: 도구 이름
      placeholder: 민원 답변서 초안 프롬프트
    validations:
      required: true
  - type: input
    id: summary
    attributes:
      label: 한 줄 설명
      description: 무엇을 넣으면 무엇이 나오는지 한 문장으로.
      placeholder: 민원 요지와 규정을 넣으면 공문 형식 답변서 초안을 만들어 줍니다
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 업무 분야
      options:
        - 민원
        - 문서작성
        - 인사·복무
        - 재정·회계
        - 계약·구매
        - 법제·조례
        - 데이터·통계
        - 교육·훈련
        - 복지
        - 홍보
        - 기타
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: 도구 유형
      options:
        - 프롬프트
        - GPTs·맞춤봇
        - 에이전트 스킬
        - 스크립트
        - 엑셀·한글 매크로
        - 노코드 앱
        - 양식·템플릿
        - 기타
    validations:
      required: true
  - type: input
    id: platforms
    attributes:
      label: 쓰는 곳
      description: 쉼표로 구분합니다.
      placeholder: ChatGPT, Claude, 엑셀
  - type: input
    id: url
    attributes:
      label: 도구 주소
      description: 파일·챗봇·저장소 링크. 프롬프트만 있는 도구는 비워 두고 아래에 본문을 넣으세요. **주소와 프롬프트 중 하나는 꼭 있어야 합니다.**
      placeholder: https://github.com/...
  - type: textarea
    id: prompt
    attributes:
      label: 프롬프트 본문
      description: 있으면 카드에서 바로 복사할 수 있습니다. 빈칸은 (여기에 붙여넣기)처럼 표시해 두세요.
      render: text
  - type: textarea
    id: howto
    attributes:
      label: 사용 방법
      description: 처음 보는 사람이 따라 할 수 있게 번호를 붙여 적어 주세요. 주의할 점도 함께.
      placeholder: |
        1. 프롬프트를 복사해서 ChatGPT에 붙여넣습니다.
        2. (여기에 붙여넣기) 자리에 실제 내용을 넣습니다.
        3. 결과에서 [담당자 확인 필요] 표시를 확인한 뒤 씁니다.
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: 작성자 표시 이름
      description: 실명이 아니어도 됩니다. 비워 두면 GitHub 아이디가 표시됩니다.
      placeholder: 홍주무관
  - type: input
    id: org
    attributes:
      label: 소속
      placeholder: ○○시청 민원과 (선택)
  - type: dropdown
    id: license
    attributes:
      label: 이용 조건
      description: 다른 사람이 이 도구를 어디까지 써도 되는지.
      options:
        - 공공누리 제1유형
        - CC BY 4.0
        - MIT
        - 자유 이용
        - 문의 후 이용
    validations:
      required: true
  - type: input
    id: tags
    attributes:
      label: 태그
      description: 쉼표로 구분합니다.
      placeholder: 민원, 답변서, 공문
  - type: checkboxes
    id: confirm
    attributes:
      label: 확인 사항
      options:
        - label: 개인정보, 비공개 자료, 내부망에서만 볼 수 있는 정보를 넣지 않았습니다.
          required: true
        - label: 내가 만든 도구이거나, 공유할 권한이 있는 도구입니다.
          required: true
        - label: 실제 민원인·직원의 이름, 연락처, 사건번호는 예시라도 쓰지 않았습니다.
          required: true
