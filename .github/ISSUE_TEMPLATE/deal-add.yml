name: 딜 올리기
description: 내 쉐어링크를 붙여넣으면 사이트에 올라가고, 카톡 문구를 답글로 드립니다.
title: "딜: "
labels: ["deal"]
body:
  - type: input
    id: link
    attributes:
      label: 쉐어링크 주소
      description: 토스 앱 / 쿠팡 파트너스에서 복사한 **내 링크**를 넣으세요.
      placeholder: https://toss.im/_m/XXXXXXXX
    validations:
      required: true
  - type: input
    id: price
    attributes:
      label: 지금 가격
      placeholder: "19900"
    validations:
      required: true
  - type: input
    id: list-price
    attributes:
      label: 평소 가격
      description: 적으면 할인율이 자동으로 계산됩니다.
      placeholder: "34000"
  - type: input
    id: title
    attributes:
      label: 상품명
      description: 비워두면 링크에서 자동으로 가져옵니다. 못 가져오면 답글로 알려 드려요.
  - type: input
    id: image
    attributes:
      label: 이미지 주소
      description: 비워두면 링크에서 자동으로 가져옵니다.
  - type: dropdown
    id: category
    attributes:
      label: 카테고리
      options:
        - 식품
        - 생활
        - 가전
        - 패션
        - 반려동물
        - 육아
        - 기타
  - type: input
    id: note
    attributes:
      label: 한 줄 메모
      placeholder: 평소 3만원대, 이 가격 잘 없어요
  - type: checkboxes
    id: flags
    attributes:
      label: 표시
      options:
        - label: 🔥 대박 딜로 표시
