name: 딜 올리기
description: 쿠팡·토스 공유하기 내용을 그대로 붙여넣으면 사이트에 올라갑니다.
title: "딜: "
labels: ["deal"]
body:
  - type: textarea
    id: paste
    attributes:
      label: 붙여넣기
      description: |
        쿠팡·토스 앱의 **공유하기**로 복사한 내용을 그대로 붙여넣으세요.
        링크와 상품명을 알아서 갈라냅니다. 링크만 넣어도 됩니다.
      placeholder: |
        쿠팡을 추천합니다!
         키토리지 맥세이프 차량 거치대 핸드폰거치대
         https://link.coupang.com/a/XXXXXXX
    validations:
      required: true
  - type: input
    id: price
    attributes:
      label: 지금 가격
      description: 쇼핑몰이 가격을 안 내줘서 이것만 직접 적어 주세요.
      placeholder: "14900"
    validations:
      required: true
  - type: input
    id: list-price
    attributes:
      label: 평소 가격
      description: 적으면 할인율이 자동으로 계산됩니다.
      placeholder: "24900"
  - type: dropdown
    id: grade
    attributes:
      label: 등급
      description: 🔥 개수가 등급입니다. 애매하면 비워 두세요.
      options:
        - "무지성급 🔥🔥🔥 (역대 최저가)"
        - "대박 🔥🔥 (평소보다 크게 쌈)"
        - "추천 🔥 (살 만한 가격)"
  - type: dropdown
    id: category
    attributes:
      label: 카테고리
      options:
        - 고기·메인반찬
        - 간식·음료
        - 과일·채소
        - 생활용품·기타
        - 가전·디지털
        - 패션·뷰티
        - 반려동물
        - 육아
  - type: input
    id: name
    attributes:
      label: 상품명
      description: 붙여넣은 내용에서 못 찾았을 때만 씁니다. 보통 비워 두세요.
  - type: input
    id: note
    attributes:
      label: 한 줄 메모
      placeholder: 이 가격이면 바로 담으세요
  - type: input
    id: image
    attributes:
      label: 이미지 주소
      description: 보통 비워 두세요. 링크에서 상품 사진을 못 읽어 왔을 때만 씁니다.
