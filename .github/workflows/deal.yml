name: 딜 등록 · 마감

on:
  issues:
    types: [opened, edited]

# 이슈를 연 사람이 저장소 주인일 때만 돕니다.
# 공개 저장소라 누구나 이슈를 열 수 있고, 이 조건이 없으면 남의 링크가 사이트에 올라갑니다.
jobs:
  apply:
    if: >-
      github.event.issue.user.login == github.repository_owner &&
      github.event.issue.state == 'open' &&
      (contains(github.event.issue.body, '### 쉐어링크 주소') ||
       contains(github.event.issue.body, '### 마감할 딜'))
    runs-on: ubuntu-latest
    permissions:
      issues: write
    concurrency:
      group: deals-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 딜 반영
        env:
          MODE: ${{ contains(github.event.issue.body, '### 마감할 딜') && 'end' || 'add' }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          SITE_URL: ${{ vars.SITE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/add-deal.mjs

      - name: 이슈에 답글
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          test -f .deal-comment.md || exit 0
          gh issue comment "$ISSUE_NUMBER" --body-file .deal-comment.md

      - name: 이슈 닫기
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE_NUMBER"
