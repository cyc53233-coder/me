name: Cloudflare Workers 배포

# main 에 사이트 파일이 바뀌면 todays-hotdeal 워커로 올립니다 (wrangler.jsonc).
# 저장소 시크릿 CLOUDFLARE_API_TOKEN · CLOUDFLARE_ACCOUNT_ID 가 없으면 실패하지 않고 건너뜁니다.
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "about.html"
      - "add.html"
      - "assets/**"
      - "data/**"
      - "wrangler.jsonc"
      - ".assetsignore"
      - ".github/workflows/cloudflare.yml"
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 시크릿 확인
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo "### 건너뜀"
              echo "저장소 시크릿 \`CLOUDFLARE_API_TOKEN\`, \`CLOUDFLARE_ACCOUNT_ID\` 가 없어 배포하지 않았습니다."
              echo "Settings → Secrets and variables → Actions 에 둘을 넣으면 다음 푸시부터 올라갑니다 (README 5번)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 워커로 올리기
        if: steps.secrets.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
