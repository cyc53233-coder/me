name: 쿠팡 자동 게시

on:
  schedule:
    # 매일 오전 9시 10분, 저녁 6시 10분 (한국 시간)
    - cron: "10 0,9 * * *"
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deals-write
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 골드박스에서 딜 고르기
        id: pick
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          COUPANG_SUB_ID: ${{ secrets.COUPANG_SUB_ID }}
        run: node scripts/auto-coupang.mjs

      - name: 사이트에 올리기
        if: steps.pick.outputs.changed == 'true'
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/deals.js
          git commit -m "$(cat .deal-commit-message)"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
